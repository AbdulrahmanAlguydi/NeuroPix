<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/css/app.css">
<title>Sign Up | NeuroPix</title>
</head>
<body class="auth-body">
<header class="public-nav">
  <a class="brand" href="index.html"><span class="logo-mark">N</span><span class="brand-name">NeuroPix</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="login.html">Login</a>
    <a class="btn btn-accent" href="login.html">Get Started</a>
  </nav>
</header>

<main class="auth-center">
  <section class="auth-card register-card">
    <span class="eyebrow large-eyebrow">CREATE ACCOUNT</span>
    <h1>Join NeuroPix</h1>
    <p>Create your account to access the workspace.</p>
    <form id="registerForm">
      <label>Username<input id="registerUsername" type="text" placeholder="Choose a username" required></label>
      <label>Password<input id="registerPassword" type="password" minlength="8" placeholder="Minimum 8 characters" required></label>
      <label>Confirm Password<input id="confirmPassword" type="password" minlength="8" placeholder="Repeat your password" required></label>
      <button class="btn btn-accent full" type="submit">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>
<script src="assets/js/auth.js"></script>
</body>
</html>
