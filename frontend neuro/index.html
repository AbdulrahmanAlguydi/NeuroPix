<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroPix</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Landing page -->
  <section id="landingView" class="view active">
    <nav class="navbar">
      <h2>NeuroPix</h2>
      <div>
        <button data-route="login">Login</button>
        <button data-route="register">Register</button>
      </div>
    </nav>

    <main class="hero">
      <h1>Image Processing Workspace</h1>
      <p>Upload images and view results returned by the backend.</p>
      <button class="primary" data-route="register">Get Started</button>
    </main>
  </section>

  <!-- Login and register page -->
  <section id="authView" class="view page-center">
    <div class="card auth-card">
      <button class="link-button" data-route="landing">← Back</button>

      <form id="loginForm">
        <h2>Login</h2>
        <label>Username</label>
        <input id="loginUsername" type="text" required>
        <label>Password</label>
        <input id="loginPassword" type="password" required>
        <button class="primary" type="submit">Login</button>
        <button type="button" data-auth-mode="register">Create account</button>
      </form>

      <form id="registerForm" class="hidden">
        <h2>Register</h2>
        <label>Username</label>
        <input id="registerUsername" type="text" required>
        <label>Email</label>
        <input id="registerEmail" type="email" required>
        <label>Password</label>
        <input id="registerPassword" type="password" minlength="8" required>
        <button class="primary" type="submit">Create account</button>
        <button type="button" data-auth-mode="login">Back to login</button>
      </form>
    </div>
  </section>
